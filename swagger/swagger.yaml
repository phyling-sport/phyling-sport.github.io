openapi: 3.1.1
info:
  title: Phyling API
  description: API for Phyling application (can be used on app.phyling.fr or on a Maxi-Hub).
  version: 7.0.6

tags:
  - name: OAuth
    description: OAuth routes
  - name: Webhooks
    description: Webhook subscription routes, for a third-party OAuth application
  - name: Clients
    description: Clients routes
  - name: Users
    description: Users routes
  - name: Devices
    description: Devices routes
  - name: DevicesRT
    description: Devices realtime routes
  - name: Records
    description: Records routes
  - name: Utils
    description: Utils routes

servers:
  - url: https://api.app.phyling.fr
    description: Phyling cloud server
  - url: https://api.staging.cl.phyling.fr
    description: Phyling staging server
  - url: http://192.168.1.42:5001
    description: Maxi-Hub local server

paths:
  /login:
    get:
      tags:
        - Users
      summary: Get information about connected user
      responses:
        "200":
          description: User data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "401":
          $ref: '#/components/responses/401'
  /refresh:
    post:
      tags:
        - Users
      summary: Refresh the access token
      description: >
        Exchange the refresh token carried by `Authorization: Bearer <refresh_token>` for a new
        access token. The refresh token is rotated at every use: the returned `refresh_token`
        replaces the presented one. Replaying the previous refresh token within the grace window
        returns the very same pair; presenting it later revokes the whole session.
      responses:
        "200":
          description: New access and refresh tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
                  refresh_token:
                    type: string
                    example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
                  token_type:
                    type: string
                    example: "Bearer"
                  expires_in:
                    type: integer
                    description: Access token lifetime, in seconds
                    example: 10800
        "401":
          $ref: '#/components/responses/401'
  /logout:
    post:
      tags:
        - Users
      summary: Log out the session of the presented token
      description: >
        Revoke **only** the session the presented access token belongs to: nothing else of the
        user is touched, neither their other devices nor the sessions they granted to other
        applications, and the user is not logged out of Phyling. Idempotent, and works both for
        a front login session and for a session opened by an OAuth2 application. An API key
        carries no session and always answers `{"revoked": false}`.

        To revoke every session of one user on **your** application at once, use
        `POST /oauth/logout`, which is scoped to that (user, application) pair.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                    description: True when a live session was revoked by this call
                    example: true
        "401":
          $ref: '#/components/responses/401'
  /oauth/authorize:
    get:
      tags:
        - OAuth
      summary: OAuth authorization endpoint
      description: If the user is logged in issue a code and redirect, else show login HTML
      parameters:
        - in: query
          name: client_id
          schema:
            type: string
          required: true
          description: OAuth app client ID
        - in: query
          name: redirect_uri
          schema:
            type: string
          required: true
          description: Redirect URI after authorization
        - in: query
          name: state
          schema:
            type: string
          required: false
          description: Optional state parameter for security
      responses:
        "200":
          description: OAuth authorization page
          content:
            text/html:
              schema:
                type: string
        "400":
          description: App disabled or redirect URI not allowed
  /oauth/code:
    post:
      tags:
        - OAuth
      summary: Create OAuth authorization code
      description: Create an authorization code for the authenticated Phyling user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  example: "app_123"
                redirect_uri:
                  type: string
                  example: "https://example.com/callback"
                state:
                  type: string
                  example: "random_state_string"
              required:
                - client_id
                - redirect_uri
      responses:
        "200":
          description: Authorization code created
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "abc123def456"
                  redirect_uri:
                    type: string
                    example: "https://example.com/callback"
                  state:
                    type: string
                    example: "random_state_string"
                  expires_at:
                    type: string
                    example: "2023-12-04T10:30:00Z"
                  redirect_next:
                    type: string
                    example: "https://example.com/callback?code=abc123def456&state=random_state_string"
        "400":
          description: App disabled or redirect URI not allowed
        "401":
          $ref: '#/components/responses/401'
  /oauth/token:
    post:
      tags:
        - OAuth
      summary: Exchange authorization code or refresh token for access/refresh JWTs
      description: >
        Exchange an authorization code or refresh token for access/refresh JWTs.
        The body may be sent as JSON or as application/x-www-form-urlencoded, and the client
        credentials may be sent either in the body (client_secret_post) or in an
        `Authorization: Basic base64(client_id:client_secret)` header (client_secret_basic).
        When both channels carry a client_id, they must match. `redirect_uri` is mandatory for
        the authorization_code grant and ignored for the refresh_token grant.
        Each successful exchange rotates the refresh token: the previous one must be dropped.
      security:
        - basicAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
                  refresh_token:
                    type: string
                    example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
                  token_type:
                    type: string
                    example: "Bearer"
                  expires_in:
                    type: integer
                    description: Access token lifetime in seconds
                    example: 10800
                  user:
                    $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/OAuthError'
        "401":
          $ref: '#/components/responses/OAuthError'
  /oauth/userinfo:
    get:
      tags:
        - OAuth
      summary: Get the identity of the user behind an OAuth2 access token
      description: >
        Return the identity of the user who authorized the calling application. Requires an
        OAuth2 access token (`Authorization: Bearer <access_token>`); an API key or a token
        issued by the Phyling web login is refused. The payload stays minimal: everything else
        is read from the regular API routes with the same token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthUserInfo'
        "401":
          $ref: '#/components/responses/401'
        "403":
          description: The token is not an OAuth2 access token
    post:
      tags:
        - OAuth
      summary: Get the identity of the user behind an OAuth2 access token
      description: Same as the GET form, for clients that post to the userinfo endpoint.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthUserInfo'
        "401":
          $ref: '#/components/responses/401'
        "403":
          description: The token is not an OAuth2 access token
  /oauth/revoke:
    post:
      tags:
        - OAuth
      summary: Revoke an access or refresh token (RFC 7009)
      description: >
        Revoke the session behind the given token: no further access token can be obtained
        from it. Access tokens already issued stay valid until they expire.
        Authenticated by the application credentials, in the body or in an
        `Authorization: Basic` header. Always answers 200, even for an unknown, expired or
        already revoked token.
      security:
        - basicAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthRevokeRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRevokeRequest'
      responses:
        "200":
          description: Token revoked, or unknown to this application
        "400":
          $ref: '#/components/responses/OAuthError'
        "401":
          $ref: '#/components/responses/OAuthError'
  /oauth/logout:
    post:
      tags:
        - OAuth
      summary: Disconnect the current user from the calling application
      description: >
        Revoke every session the current user holds on the calling application, on all their
        devices. Scoped to that user only: the application keeps serving its other users.
        Requires an OAuth2 access token (`Authorization: Bearer <access_token>`).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked_sessions:
                    type: integer
                    example: 2
        "401":
          $ref: '#/components/responses/401'
        "403":
          description: The token is not an OAuth2 access token
  /webhooks/subscriptions:
    post:
      tags:
        - Webhooks
      summary: Declare a new webhook subscription
      description: >
        Create a subscription for the calling OAuth application: one URL, one list of event
        types among `record.created`, `record.updated`, `record.deleted`, `user.created`,
        `user.updated`, `user.deleted`, and one signing secret shown only this once.
        Authenticated with the application credentials, in the body or in an
        `Authorization: Basic` header, exactly like `/oauth/token`. `payload_format` must be one
        of the formats the managing client of the application allows.
        The url must use HTTPS and resolve to a public address: private, loopback and
        link-local targets are refused, including their encoded forms.
      security:
        - basicAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionCreateRequest'
      responses:
        "200":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionWithSecret'
        "400":
          description: Invalid url, event_types or payload_format, or subscription quota reached
        "401":
          $ref: '#/components/responses/OAuthError'
        "403":
          description: This application is disabled, not allowed to use webhooks, or not this payload format
    get:
      tags:
        - Webhooks
      summary: List the subscriptions of the calling application
      description: >
        Never carries any secret. Credentials go in an `Authorization: Basic` header: this method carries no
        body, and the credentials are never read from the query string.
      security:
        - basicAuth: []
      responses:
        "200":
          description: Subscriptions of the calling application
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookSubscription'
        "401":
          $ref: '#/components/responses/OAuthError'
        "403":
          description: This application is disabled
  /webhooks/subscriptions/{subscription_id}:
    get:
      tags:
        - Webhooks
      summary: Read one subscription of the calling application
      description: >
        Credentials go in an `Authorization: Basic` header: this method carries no
        body, and the credentials are never read from the query string.
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/subscription_id'
      responses:
        "200":
          description: Subscription data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        "401":
          $ref: '#/components/responses/OAuthError'
        "403":
          description: This application is disabled
        "404":
          description: Subscription not found, or belongs to another application
    put:
      tags:
        - Webhooks
      summary: Update a subscription
      description: >
        Every field is optional: send only what changes. Setting `active` to false pauses the
        deliveries without deleting the subscription.
      security:
        - basicAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/subscription_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionUpdateRequest'
      responses:
        "200":
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        "400":
          description: Invalid url, event_types or payload_format
        "401":
          $ref: '#/components/responses/OAuthError'
        "403":
          description: This application is disabled, or this payload format is not allowed for it
        "404":
          description: Subscription not found, or belongs to another application
    delete:
      tags:
        - Webhooks
      summary: Delete a subscription
      description: >
        Also deletes every delivery still queued for it.
        Credentials go in an `Authorization: Basic` header: this method carries no
        body, and the credentials are never read from the query string.
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/subscription_id'
      responses:
        "200":
          description: Subscription deleted
        "401":
          $ref: '#/components/responses/OAuthError'
        "403":
          description: This application is disabled
        "404":
          description: Subscription not found, or belongs to another application
  /webhooks/subscriptions/{subscription_id}/rotate_secret:
    post:
      tags:
        - Webhooks
      summary: Rotate the signing secret of a subscription
      description: >
        Issue a new signing secret, shown only this once. The previous secret keeps signing
        deliveries alongside the new one for grace_seconds (24 h by default): during that
        window every delivery carries two `v1` signatures in `X-Phyling-Signature`, and only one
        of them has to validate, so the verifier can be redeployed without missing a delivery.
      security:
        - basicAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/subscription_id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_seconds:
                  type: integer
                  description: How long the previous secret stays valid, at most 24 h (86400 s)
                  example: 86400
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grace_seconds:
                  type: integer
                  example: 86400
      responses:
        "200":
          description: Secret rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionWithSecret'
        "400":
          description: grace_seconds must be an integer between 0 and 86400
        "401":
          $ref: '#/components/responses/OAuthError'
        "403":
          description: This application is disabled
        "404":
          description: Subscription not found, or belongs to another application
  /users/all:
    post:
      tags:
        - Users
      summary: Get info about all users
      description: Get info about all users in the scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: integer
                  example: 1
                  description: Select one client (only for admin)
                group_ids:
                  type: array
                  example: []
                role:
                  type: string
                  example: Athlete
                  description: Should be `Admin`, `Manager`, `Coach` or `Athlete`
                active:
                  type: boolean
                  example: true
                  description: Select only active users
                search:
                  type: string
                  example: ""
                pageId:
                  type: integer
                  example: 1
                pageSize:
                  type: integer
                  example: 50
                  description: >
                    Page size. A full-detail listing (`soft` false) is always paginated and
                    capped at 200 per page: `pageSize` <= 0 or above 200 is clamped to 200.
                    `total` stays exact, so compare it with the number of returned items to
                    know whether more pages remain. Use `soft` true to list everything at once.
                soft:
                  type: boolean
                  example: true
                  description: Returns only minimal information on users, and lifts the page cap
      responses:
        "200":
          description: The users list
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 120
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                    example: []
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
  /devices/all:
    post:
      tags:
        - Devices
      summary: Get all devices
      description: Available for admin only
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: string
                  example: 200
                  description: Search in device number, name or comment
                clientId:
                  type: integer
                  example: 2
                enabled:
                  type: boolean
                  example: true
                type:
                  type: array
                  example: [10, 20]
                sortBy:
                  type: array
                  description: List of sort entries applied in order
                  items:
                    type: object
                    required: [field, order]
                    properties:
                      field:
                        type: string
                        enum: [number, name, created_date, client, in_stock]
                      order:
                        type: string
                        enum: [asc, desc]
                  example: [{ field: number, order: asc }]
                pageId:
                  type: integer
                  example: 1
                pageSize:
                  type: integer
                  example: 10
      responses:
        "200":
          description: The devices list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                    example: []
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
  /devices/all/soft:
    get:
      tags:
        - Devices
      summary: Get all devices in "soft" version (not all datas)
      description: Available for all connected users
      parameters:
        - in: query
          name: clientId
          schema:
            type: integer
            example: 2
          required: false
          description: Select for one client (only for admin)
        - in: query
          name: type
          schema:
            type: integer
            example: 10
          required: false
          description: The device type (for example 10 for Maxi-Phyling)
      responses:
        "200":
          description: The devices list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                    example: []
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'

  /devices/rt/{client_id}/all:
    post:
      tags:
        - DevicesRT
      summary: List all devices real-time data for a client
      description: Returns all real-time data for devices connected to a client. Only available for admin or the client itself.
      parameters:
        - in: path
          name: client_id
          schema:
            type: integer
          required: true
          description: Numeric ID of the client
      responses:
        "200":
          description: All devices real-time data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  example: [{'name': 'Maxi 300', 'number': 10200300, 'is_connected': True, 'state': 'idle'}]
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
  /devices/rt/{client_id}/{device_number}/settings:
    get:
      tags:
        - DevicesRT
      summary: Get one device real-time settings
      description: Get the real-time settings for a specific device. Only available for admin or the client itself.
      parameters:
        - in: path
          name: client_id
          schema:
            type: integer
          required: true
          description: Numeric ID of the client
        - in: path
          name: device_number
          schema:
            type: integer
          required: true
          description: Numeric number of the device
      responses:
        "200":
          description: Device real-time settings
          content:
            application/json:
              schema:
                type: object
                example: {
                  "number": 10200300,
                  "name": "Maxi 300",
                  "client": { "id": 2, "name": "phyling" },
                  "group": { "id": 1, "name": "phyling" },
                  "user": { "id": 10, "mail": "tim.nicolas@phyling.fr", "firstname": "Tim", "lastname": "Nicolas", "active": true },
                  "sport": { "name": "default", "display_name": "D\u00e9faut" },
                  "is_connected": true,
                  "features": {
                    "restart": { "cmd": "v1.board.restart" },
                    "shutdown": { "cmd": "v1.board.shutdown" },
                    "config": { "cmd_set": "v1.board.config.set", "cmd_get": "v1.board.config.get" },
                    "wifi": { "cmd_set": "v1.board.wifi.set", "cmd_get": "v1.board.wifi.get" },
                    "device_info": { "cmd_set": "v1.board.device_info.set", "cmd_get": "v1.board.device_info.get" },
                    "calib": { "cmd_set": "v1.board.calib.set", "cmd_get": "v1.board.calib.get" },
                    "time_set": { "cmd": "v1.board.time.set" },
                    "record": { "cmd_start": "v1.record.rec.start", "cmd_stop": "v1.record.rec.stop", "cmd_realtime": "v1.record.realtime.set" }
                  },
                  "modules": {
                    "gps": { "id": 1, "type": "gps", "is_connected": false },
                    "imu": { "id": 2, "type": "imu", "is_connected": true }
                  },
                  "timezone": "Europe/Paris",
                  "version": "v7.0.0",
                  "needFirmwareUpdate": false,
                  "mqtt_refresh_delay": 0,
                  "disconnect_timeout": 30,
                  "available_connectivity": ["wifi", "lte"],
                  "network_infos": { "has_roaming": false },
                  "battery": 100,
                  "epoch": 1756289565.0,
                  "state": "idle",
                  "realtime_data_keys": null,
                  "realtime_indicator_keys": null,
                  "recTime": 0.0,
                  "recTimeSinceEpoch": 0.0
                }
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "418":
          $ref: '#/components/responses/418'
  /devices/rt/{client_id}/{device_number}/status:
    get:
      tags:
        - DevicesRT
      summary: Get one device real-time status
      description: Get the real-time status for a specific device. Only available for admin or the client itself.
      parameters:
        - in: path
          name: client_id
          schema:
            type: integer
          required: true
          description: Numeric ID of the client
        - in: path
          name: device_number
          schema:
            type: integer
          required: true
          description: Numeric number of the device
      responses:
        "200":
          description: Device real-time status
          content:
            application/json:
              schema:
                type: object
                example: {
                  "number": 10200300,
                  "is_connected": true,
                  "battery": 100,
                  "epoch": 1756289737.0,
                  "state": "record",
                  "modules": {
                    "gps": { "is_connected": false, "realtime": false },
                    "imu": { "is_connected": true, "realtime": true }
                  },
                  "realtime_data_keys": [
                    {
                      "name": "gps.latitude",
                      "label": "gps.latitude",
                      "description": "",
                      "unit": "",
                      "precision": 3,
                      "yRange": []
                    },
                    {
                      "name": "gps.speed",
                      "label": "gps.speed",
                      "description": "",
                      "unit": "m/s",
                      "precision": 3,
                      "yRange": []
                    },
                    {
                      "name": "imu.acc",
                      "label": "imu.acc",
                      "description": "",
                      "unit": "m/s2",
                      "precision": 3,
                      "yRange": []
                    }
                  ],
                  "realtime_indicator_keys": [
                    {
                      "unit": { "fr": "m/s2", "en": "m/s2" },
                      "description": { "fr": "Acc", "en": "Acc" },
                      "precision": 2,
                      "enabled": true,
                      "name": "imu",
                      "type": "number"
                    }
                  ],
                  "recTime": 10.010580062866211,
                  "recTimeSinceEpoch": 1759392302.368264,
                  "network_infos": { "has_roaming": false }
                }
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "418":
          $ref: '#/components/responses/418'
  /devices/rt/{client_id}/{device_number}/realtime:
    post:
      tags:
        - DevicesRT
      summary: Set device real-time data
      description: |
        Set device real-time data for `realtime_expiration` seconds (120 by default). You need to call it periodically to keep the real-time data active.
        You can enable by module or by real-time data keys.
        Only available for admin or the client itself.
      parameters:
        - in: path
          name: client_id
          schema:
            type: integer
          required: true
          description: Numeric ID of the client
        - in: path
          name: device_number
          schema:
            type: integer
          required: true
          description: Numeric number of the device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                modules:
                  type: array
                  items:
                    type: string
                  example: ["imu", "adc"]
                  description: List of modules to set in real-time data
                realtime_data_keys:
                  type: array
                  items:
                    type: string
                  example: ["imu.acc_x", "gps.speed"]
                  description: List of real-time data keys to set
                realtime_expiration:
                  type: integer
                  minimum: 1
                  default: 120
                  example: 120
                  description: Seconds before the real-time subscription expires. Call the route again before it expires to keep the real-time data active.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "418":
          $ref: '#/components/responses/418'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
  /devices/rt/{client_id}/{device_number}/rpc/request:
    post:
      tags:
        - DevicesRT
      summary: Execute a command on a device (RPC)
      description: |
        Execute a command on a device in real-time. Only available for admin or the client itself.
        You need to specify the method OR feature and cmd_type.
        The command is always dispatched asynchronously and this route returns immediately.
        When the command is being processed it returns 201 with its `id`; poll
        `/devices/rt/{client_id}/{device_number}/rpc/response` with that `id` to get the result.
        Notifications and cached values return 200 directly with the "result" object.
      parameters:
        - in: path
          name: client_id
          schema:
            type: integer
          required: true
          description: Numeric ID of the client
        - in: path
          name: device_number
          schema:
            type: integer
          required: true
          description: Numeric number of the device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  example: v1.record.rec.start
                  description: The command to execute on the device
                feature:
                  type: string
                  example: record
                  description: The name of the feature (board, record)
                cmd_type:
                  type: string
                  example: cmd_start
                  description: The type of command (cmd, cmd_get, cmd_set, cmd_start, cmd_stop)
                params:
                  type: object
                  example: {}
                  description: The arguments for the command
                timeout:
                  type: integer
                  example: 10
                  description: Timeout for the command execution in seconds
      responses:
        "200":
          description: The command has an immediate result (notification or cached value)
          content:
            application/json:
              schema:
                type: object
                example: { "set_status": {"state": "idle"} }
        "201":
          description: Command is being processed. Poll /rpc/response with the returned `id`.
          content:
            application/json:
              schema:
                type: object
                example: { "message": "Command is being processed", "id": "3f2a1c9e-1b2c-4d5e-8f90-abcdef123456" }
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "418":
          $ref: '#/components/responses/418'
        "500":
          description: Internal server error (command execution failed)
          content:
            application/json:
              schema:
                type: object
                example: { "code": -32601, "message": "Invalid command" }
        "503":
          $ref: '#/components/responses/503'
  /devices/rt/{client_id}/{device_number}/rpc/response:
    post:
      tags:
        - DevicesRT
      summary: Get the result of a command previously sent via /rpc/request
      description: |
        Poll this route with the `id` returned by `/rpc/request`. While the device has
        not answered yet, it returns 202 (command still in progress). Once the result is
        available it is returned (200 with the result, or the mapped error status of the
        command). Polling is idempotent: the result stays available until it expires
        (a few minutes after the command timeout).
      parameters:
        - in: path
          name: client_id
          schema:
            type: integer
          required: true
          description: Numeric ID of the client
        - in: path
          name: device_number
          schema:
            type: integer
          required: true
          description: Numeric number of the device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  example: 3f2a1c9e-1b2c-4d5e-8f90-abcdef123456
                  description: The RPC request id returned by /rpc/request
      responses:
        "200":
          description: The result of the command execution (success)
          content:
            application/json:
              schema:
                type: object
                example: { "set_status": {"state": "idle"} }
        "202":
          description: The command is still being processed
          content:
            application/json:
              schema:
                type: object
                example: { "running": true, "message": "Command is being processed" }
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          description: Device not found, or unknown/expired request id
          content:
            application/json:
              schema:
                type: string
                example: Unknown or expired request id
        "500":
          description: Internal server error (command execution failed)
          content:
            application/json:
              schema:
                type: object
                example: { "code": -32601, "message": "Invalid command" }
        "503":
          $ref: '#/components/responses/503'
  /devices/rt/{client_id}/{device_number}/selection/{startstop}:
    post:
      tags:
        - DevicesRT
      summary: Start or stop a selection in real-time for a device
      description: Start or stop a selection on a device in real-time. Only available for admin or the client itself.
      parameters:
        - in: path
          name: client_id
          schema:
            type: integer
          required: true
          description: Numeric ID of the client
        - in: path
          name: device_number
          schema:
            type: integer
          required: true
          description: Numeric number of the device
        - in: path
          name: startstop
          schema:
            type: string
            enum: [start, stop]
          required: true
          description: Action to perform ("start" or "stop")
      responses:
        "200":
          description: Selection started or stopped
        "400":
          description: Invalid action
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          description: No selection running (on stop)
        "418":
          $ref: '#/components/responses/418'
        "500":
          description: Selection already running (on start)

  /devices/rt/{client_id}/{device_number}/lock:
    put:
      tags:
        - DevicesRT
      summary: Set or remove the real-time lock of a device
      description: |
        Restricts real-time access to the device to users whose ID is in the list.
        An empty list removes the lock (free access for all users of the client).
        Available for any user of the client, whether the device is connected or not.
      parameters:
        - in: path
          name: client_id
          schema:
            type: integer
          required: true
          description: Numeric ID of the client
        - in: path
          name: device_number
          schema:
            type: integer
          required: true
          description: Numeric number of the device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lock_user_ids
              properties:
                lock_user_ids:
                  type: array
                  items:
                    type: integer
                  description: List of user IDs allowed in real time (empty = unlock)
                  example: [1, 2, 3]
      responses:
        "200":
          description: Lock applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  lock_user_ids:
                    type: array
                    items:
                      type: integer
                    example: [1, 2, 3]
        "400":
          description: Invalid parameter or user not in client
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'

  /records/all:
    post:
      tags:
        - Records
      summary: Get all record informations
      description: Get rec in scope (sport for coach, all for admin, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: associated
                  description: "Type of records to get (new, associated or all)"
                pageSize:
                  type: integer
                  example: 10
                pageId:
                  type: integer
                  example: 1
                  description: >
                    1-based page number of the classic offset listing. Refused with 400 when
                    `modifiedSince` is given and it is anything but 1: an offset composes with the
                    cursor, so a catch-up would silently skip a whole page.
                onlyFavorite:
                  type: boolean
                  example: false
                userIds:
                  type: array
                  example: []
                deviceIds:
                  type: array
                  example: []
                clientIds:
                  type: array
                  example: []
                groupIds:
                  type: array
                  example: []
                exerciseIds:
                  type: array
                  example: []
                sportIds:
                  type: array
                  example: []
                record_type:
                  type: string
                  example: ""
                  description: "Filter by record type (record, scenario, seance, video)"
                scenario_ids:
                  type: array
                  items:
                    type: integer
                  example: []
                  description: Scenario ids, empty to select all
                minDate:
                  type: string
                  format: date-time
                  example: "2023-11-20T00:00:00"
                maxDate:
                  type: string
                  format: date-time
                  example: "2030-12-04T00:00:00"
                modifiedSince:
                  type: string
                  example: "2026-09-01T14:22:08.512000|8471"
                  description: >
                    Either an ISO 8601 datetime (naive or with an offset, `Z` accepted), to start
                    a catch-up from a known date, or a `next_since` cursor received from a
                    previous answer, to read the following page. Sending it orders the records by
                    modification date ascending, tie-broken by id, and adds `next_since` to the
                    answer. Same behaviour as `GET /records?since=...`, same view function. A
                    bare datetime is a **lower bound** and keeps the records modified at that
                    exact date; a value that is neither a datetime nor a cursor we handed out
                    answers 400; an **empty** value applies no filter at all and returns no
                    cursor. **Cannot be combined with a `pageId` other than 1** (400).
                timezone:
                  type: string
                  example: 'Europe/Paris'
                  description: >
                    IANA timezone the minDate and maxDate values are read in. Defaults to
                    'Europe/Paris'. Does not affect modifiedSince, which carries its own offset
                    or none.
                include_seances_subrecords:
                  type: boolean
                  example: false
                  description: >
                    Include the records held inside a seance instead of the seance alone
                fulldata:
                  type: boolean
                  example: false
      responses:
        "200":
          description: Record data
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 120
                  next_since:
                    type: string
                    example: "2026-09-01T14:22:08.512000|8471"
                    description: >
                      Opaque cursor to pass back verbatim as `modifiedSince` (or as `since` on
                      `GET /records`) to read the following page. Do not interpret it as a date,
                      do not reformat it: its shape may change, and a cursor we handed out is
                      always accepted as it is. Present only when `modifiedSince` was given and
                      the page is not empty — its **absence is the end of the pagination**, and
                      the only reliable stop condition.
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/Record'
                    example: []
        "400":
          description: >
            A malformed parameter, named by the answer: `Invalid pageSize: expected an integer`,
            `Invalid userIds: expected a list of integers`, `Invalid modifiedSince: <value>` for a
            cursor that is neither a datetime nor one we handed out, or the conflict
            `pageId cannot be combined with since`.
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "500":
          $ref: '#/components/responses/500'
  /records:
    get:
      tags:
        - Records
      summary: List the records in scope, paginated
      description: >
        Same filters, same access control and same implementation as `POST /records/all`, taken in
        the query string instead of a JSON body. With `since`, this is the catch-up route a third
        party polls to recover the record events it missed while its webhook endpoint was
        unreachable: the records come back ordered by modification date ascending, tie-broken by
        id, and `next_since` is the cursor of the following page. Walk the pages until an answer
        carries no `next_since`; that is the end of the catch-up.
      parameters:
        - in: query
          name: since
          schema:
            type: string
          example: "2026-09-01T14:22:08.512000|8471"
          description: >
            Either an ISO 8601 datetime (naive or with an offset, `Z` accepted), to start a
            catch-up from a known date, or a `next_since` cursor received from a previous answer,
            to read the following page. A cursor advances strictly, so a page never serves back
            the record it ended on; a bare datetime is a **lower bound**, so it keeps every record
            modified at that exact date — the only repetition possible, and only on the very first
            call. A value that is neither a datetime nor a cursor we handed out answers 400; an
            **empty** value is not an error, it simply applies no filter at all and the answer then
            carries no `next_since`. **Cannot be combined with `pageId`** (400): the cursor is the
            pagination, set `pageSize` and follow `next_since`.
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
          description: Page size, -1 for every selected record
        - in: query
          name: pageId
          schema:
            type: integer
            default: 1
          description: >
            1-based page number of the classic offset listing. **Refused with 400 when `since` is
            given** and it is anything but 1: an offset composes with the cursor, so a catch-up
            would silently skip a whole page. `pageSize` stays free.
        - in: query
          name: type
          schema:
            type: string
            enum: [all, new, associated]
            default: all
        - in: query
          name: userIds
          schema:
            type: string
          description: Comma-separated user ids, empty to select all
        - in: query
          name: deviceIds
          schema:
            type: string
          description: Comma-separated device ids, empty to select all
        - in: query
          name: clientIds
          schema:
            type: string
          description: >
            Comma-separated client ids, empty to select all. Narrowed to what the role allows: a
            Manager only ever sees its own client, and asking for another one answers 403.
        - in: query
          name: groupIds
          schema:
            type: string
          description: Comma-separated group ids, empty to select all
        - in: query
          name: exerciseIds
          schema:
            type: string
          description: Comma-separated exercise ids, empty to select all
        - in: query
          name: sportIds
          schema:
            type: string
          description: Comma-separated sport ids, empty to select all
        - in: query
          name: scenario_ids
          schema:
            type: string
          description: Comma-separated scenario ids, empty to select all
        - in: query
          name: record_type
          schema:
            type: string
          description: "Filter by record type (record, scenario, seance, video)"
        - in: query
          name: minDate
          schema:
            type: string
            format: date-time
        - in: query
          name: maxDate
          schema:
            type: string
            format: date-time
        - in: query
          name: timezone
          schema:
            type: string
            default: 'Europe/Paris'
          description: >
            IANA timezone the minDate and maxDate values are read in. Does not affect since,
            which carries its own offset or none.
        - in: query
          name: onlyFavorite
          schema:
            type: boolean
        - in: query
          name: include_seances_subrecords
          schema:
            type: boolean
          description: Include the records held inside a seance instead of the seance alone
        - in: query
          name: fulldata
          schema:
            type: boolean
        - in: query
          name: modifiedSince
          schema:
            type: string
          description: Accepted as a synonym of `since`; `since` wins when both are given
      responses:
        "200":
          description: Record data
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 120
                  next_since:
                    type: string
                    example: "2026-09-01T14:22:08.512000|8471"
                    description: >
                      Opaque cursor to pass back verbatim as `since` to read the following page.
                      Do not interpret it as a date, do not reformat it: its shape may change, and
                      a cursor we handed out is always accepted as it is. Present only when
                      `since` was given and the page is not empty — its **absence is the end of
                      the pagination**, and the only reliable stop condition. `total` counts the
                      records left after the cursor, so it shrinks page after page and says
                      nothing about the end.
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/Record'
                    example: []
        "400":
          description: >
            A malformed parameter, named by the answer: `Invalid pageSize: expected an integer`,
            `Invalid userIds: expected a list of integers`, `Invalid modifiedSince: <value>` for a
            cursor that is neither a datetime nor one we handed out, or the conflict
            `pageId cannot be combined with since`.
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "500":
          $ref: '#/components/responses/500'
  /records/{rec_id}:
    get:
      tags:
        - Records
      summary: Get record informations
      description: ""
      parameters:
        - $ref: '#/components/parameters/rec_id'
      responses:
        "200":
          description: Record data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
  /records/{rec_id}/file/{file_type}:
