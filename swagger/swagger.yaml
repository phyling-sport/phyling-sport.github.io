  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: OAuth application credentials, as "Basic base64(client_id:client_secret)"
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key authentication using "ApiKey <key>" format
  parameters:
    client_id:
      in: path
      name: client_id
      schema:
        type: integer
      required: true
      description: Numeric ID of the client
    group_id:
      in: path
      name: group_id
      schema:
        type: integer
      required: true
      description: Numeric ID of the group
    rec_id:
      in: path
      name: rec_id
      schema:
        type: integer
      required: true
      description: Numeric ID of the record
    sport_id:
      in: path
      name: sport_id
      schema:
        type: integer
      required: true
      description: Numeric ID of the device
    scenario_id:
      in: path
      name: scenario_id
      schema:
        type: integer
      required: true
      description: Numeric ID of the scenario
    id:
      in: path
      name: id
      schema:
        type: integer
      required: true
      description: The id of an element
    subscription_id:
      in: path
      name: subscription_id
      schema:
        type: integer
      required: true
      description: Numeric ID of the webhook subscription
  responses:
    OAuthError:
      description: OAuth 2.0 error (RFC 6749 section 5.2)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                enum: ["invalid_request", "invalid_client", "invalid_grant", "unsupported_grant_type"]
                example: "invalid_grant"
              error_description:
                type: string
                example: "Session has been revoked"
    400:  # $ref: '#/components/responses/400'
      description: Bad request
    401:  # $ref: '#/components/responses/401'
      description: Unauthorized
    403:  # $ref: '#/components/responses/403'
      description: Forbidden
    404:  # $ref: '#/components/responses/404'
      description: Not Found
    406:  # $ref: '#/components/responses/406'
      description: Not Acceptable. Disable for your back type
    409:  # $ref: '#/components/responses/409'
      description: Conflict
    418:  # $ref: '#/components/responses/418'
      description: Device is not connected
    429:  # $ref: '#/components/responses/429'
      description: Too many requests
    500:  # $ref: '#/components/responses/500'
      description: Unexpected error
    503:  # $ref: '#/components/responses/503'
      description: Service Unavailable. Turning off

security:
  - bearerAuth: []
  - apiKeyAuth: []
