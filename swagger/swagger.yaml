  /records/gps_data:
    post:
      tags:
      - Records
      summary: Get GPS data filtered by LOD score for map rendering
      description: |
        Get GPS coordinates filtered by a pre-computed LOD (Level of Detail) importance score for
        efficient map rendering. Uses per-point Douglas-Peucker importance scores computed at analysis
        time when available; falls back to on-the-fly computation otherwise.
        Each record entry contains one or more GPS source descriptors (one per GPS source in the record).
        Altitude is included in coordinates when `gps_vars.alt` is provided.
        Additional scalar variables (e.g. speed) are returned at the same indices as the filtered track.
        ```
        Request params: (for each GPS entry per record)
            gps_vars:
                - lat: variable name for latitude (e.g. "gps.latitude")
                - lng: variable name for longitude (e.g. "gps.longitude")
                - alt: variable name for altitude (optional, null to omit)
                - pdop: variable name for PDOP (optional). When null, auto-derived from the latitude name
                  (e.g. "gps.latitude" -> "gps.PDOP", "mini.gps_latitude" -> "mini.gps_PDOP")
                - nsat: variable name for nSat (optional). When null, auto-derived from the latitude name
                  (e.g. "gps.latitude" -> "gps.nSat", "mini.gps_latitude" -> "mini.gps_nSat")
            vars: list of additional scalar variables to return at filtered indices
            epsilon: LOD threshold in meters (optional — if provided, overrides auto-scale)
            target_min: minimum number of GPS points to return when auto-scaling (default 100)
            target_max: maximum number of GPS points to return when auto-scaling (default 10000)
            pdop_max: optional float — when set and the PDOP column exists, points with PDOP > pdop_max
                      are dropped (NaN PDOP values are kept). Default null disables the filter.
            nsat_min: optional int — when set and the nSat column exists, points with nSat < nsat_min
                      are dropped (NaN nSat values are kept). Default null disables the filter.
                      When both pdop_max and nsat_min are set (with both columns available), conditions
                      combine in AND mode.
            x:
                - type: "range" or "selection"
                - name: X axis name — "T" (time), "D" (distance) or "T_norm"
                - range: [start, end] filter (only for type "range"; [] = whole record)
                - num: selection number (only for type "selection")

        Response format:
            "<rec_id>": {
                "<lat_var>": {
                    "type": "FeatureCollection",
                    "features": [{
                        "type": "Feature",
                        "geometry": {
                            "type": "LineString",
                            "coordinates": [[lng, lat], ...]   // [lng, lat, alt] when alt is provided
                        },
                        "properties": {
                            "values": {
                                "T": [0.0, 0.5, ...],          // timestamps of kept points (always present)
                                "D": [0.0, 12.5, ...],         // distances (present if available in record)
                                "T_norm": [0.0, 0.5, ...],     // normalized time (present if available in record)
                                "<var>": [12.5, ...]            // extra vars at same indices
                            },
                            "stats": {
                                "<var>": {"min": 0.0, "max": 25.0, "mean": 12.0}
                            }
                        }
                    }]
                }
            }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: object
                      required:
                        - gps_vars
                      properties:
                        gps_vars:
                          type: object
                          required:
                            - lat
                            - lng
                          properties:
                            lat:
                              type: string
                              description: Variable name for latitude (e.g. "gps.latitude")
                            lng:
                              type: string
                              description: Variable name for longitude (e.g. "gps.longitude")
                            alt:
                              type: [string, "null"]
                              description: Variable name for altitude (null to omit)
                            pdop:
                              type: [string, "null"]
                              description: |
                                Variable name for PDOP (null to auto-derive from the latitude name —
                                e.g. "gps.latitude" -> "gps.PDOP", "mini.gps_latitude" -> "mini.gps_PDOP").
                            nsat:
                              type: [string, "null"]
                              description: |
                                Variable name for nSat (null to auto-derive from the latitude name —
                                e.g. "gps.latitude" -> "gps.nSat", "mini.gps_latitude" -> "mini.gps_nSat").
                        vars:
                          type: array
                          items:
                            type: string
                          description: Additional scalar variables to return at filtered indices
                          default: []
                        epsilon:
                          type: [number, "null"]
                          description: "If provided, overrides auto-scale: only points with LOD score >= epsilon are kept"
                        target_min:
                          type: integer
                          default: 100
                          description: Minimum number of GPS points to return when auto-scaling
                        target_max:
                          type: integer
                          default: 10000
                          description: Maximum number of GPS points to return when auto-scaling
                        pdop_max:
                          type: [number, "null"]
                          description: |
                            Optional PDOP threshold. When set and the PDOP column exists, points with
                            PDOP > pdop_max are dropped (NaN PDOP values are kept). Default null disables the filter.
                          default: null
                        nsat_min:
                          type: [integer, "null"]
                          description: |
                            Optional nSat threshold. When set and the nSat column exists, points with
                            nSat < nsat_min are dropped (NaN nSat values are kept). Default null disables the filter.
                            Combines with pdop_max in AND mode when both are active.
                          default: null
                        x:
                          type: object
                          description: X axis filter configuration
                          properties:
                            type:
                              type: string
                              enum: [range, selection]
                              default: range
                              description: '"range" to filter by explicit bounds, "selection" to use a saved selection'
                            name:
                              type: string
                              enum: [T, D, T_norm]
                              default: T
                              description: X axis variable — T (time in seconds), D (distance in meters), T_norm
                            range:
                              type: array
                              items:
                                type: number
                              description: "Filter bounds [start, end] (type range only; [] = whole record)"
                              default: []
                            num:
                              type: [integer, "null"]
                              description: Selection number (type selection only)
              example: {
                "data": {
                  "818": [
                    {
                      "gps_vars": {
                        "lat": "gps.latitude",
                        "lng": "gps.longitude",
                        "alt": null,
                        "pdop": null,
                        "nsat": null
                      },
                      "vars": ["gps.speed"],
                      "epsilon": null,
                      "target_min": 100,
                      "target_max": 10000,
                      "pdop_max": 5,
                      "nsat_min": 6,
                      "x": {"type": "range", "name": "T", "range": [0.0, 100.0]}
                    }
                  ]
                }
              }
      responses:
        "200":
          description: GeoJSON FeatureCollections keyed by record id and latitude variable name
          content:
            application/json:
              schema:
                type: object
                example: {
                  "818": {
                    "gps.latitude": {
                      "type": "FeatureCollection",
                      "features": [
                        {
                          "type": "Feature",
                          "geometry": {
                            "type": "LineString",
                            "coordinates": [ [2.3522, 48.8566], [2.3530, 48.8572], [2.3545, 48.8580] ]
                          },
                          "properties": {
                            "values": {
                              "T": [0.0, 0.5, 1.2],
                              "D": [0.0, 6.3, 15.1],
                              "gps.speed": [12.5, 12.6, 13.1]
                            },
                            "stats": {
                              "gps.speed": {"min": 12.5, "max": 13.1, "mean": 12.73}
                            }
                          }
                        }
                      ]
                    }
                  }
                }
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "500":
          $ref: '#/components/responses/500'

  /records/polar_data:
    post:
      tags:
      - Records
      summary: Get polar (angle / radius) plot data for one or more records
      description: |
        Compute polar plot data (angular axis vs radius value(s)) for the pi3d "force / crank
        angle" visualisation. The angular axis is a 0-360° variable (e.g. `Theta`), the radius is
        one or more value variables (e.g. `Ft_d` / `Ft_g`), and pedalling cycles are split by a
        cycle variable (default `motif_id`). Each cycle is interpolated on a shared angular grid
        (`angular_step` degrees, 360/0 wrap handled). The response uses a compact columnar format:
        BOTH the per-cycle series and the always-present `mean` series are returned (the client
        decides what to display). A single time-like variable (`x.name`) is loaded; each cycle
        carries its own `x` series aligned with `theta`.
        ```
        Request params: (for each polar entry per record)
            angle_var: REQUIRED angular axis variable (0-360°, e.g. "Theta")
            radius_vars: REQUIRED list of radius value variables (e.g. ["Ft_d", "Ft_g"])
            cycle_var: cycle id variable (default "motif_id"). Rows with cycle_var NaN or <= 0 are dropped.
            color_var: optional variable mapped to a per-cycle scalar (mean over the cycle, default null)
            filter: optional {"varname": str, "min": float|null, "max": float|null}. A whole cycle is
                     dropped when its mean of varname falls outside [min, max] (default null disables it).
            angular_step: angular binning step in degrees (default 5)
            max_points: total budget of plotted points across shown cycles, NOT a cycle count (default 5000). Cycles are sub-sampled so that n_cycles * (points per cycle, ~360/angular_step + 1) stays under it
            x:
                - type: "range" or "selection"
                - name: X axis name — "T" (time), "D" (distance) or "T_norm" (single column loaded)
                - range: [start, end] filter (only for type "range"; [] = whole record)
                - num: selection number (only for type "selection")

        Response format:
            "<rec_id>": {
                "theta": [0, step, ..., 360],                 // shared grid + 360° closing point
                "x_name": "T",
                "xrange": [min, max],
                "cycles": [
                    {"motif_id": 12,
                     "xt": [...],                               // cursor times (monotone, offset applied)
                     "xa": [...],                               // crank angle at each xt, UNWRAPPED
                                                                //   (apply xa % 360), len == len(theta)
                     "values": {"Ft_d": [...], "Ft_g": [...]},  // binned on theta, len == len(theta)
                     "color_mean": 85.3}                         // only when color_var set
                ],
                "mean": {"values": {"Ft_d": [...], "Ft_g": [...]}},  // over ALL valid cycles
                "color_var": "Cadence",                              // null when not requested
                "color_range": [min, max],                           // null when no color_var
                "meta": {"n_cycles_total": 42, "n_cycles_shown": 30, "angular_step": 5}
            }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: object
                      required:
                        - angle_var
                        - radius_vars
                      properties:
                        angle_var:
                          type: string
                          description: Angular axis variable (0-360°, e.g. "Theta")
                        radius_vars:
                          type: array
                          items:
                            type: string
                          description: Radius value variables (e.g. ["Ft_d", "Ft_g"])
                        cycle_var:
                          type: string
                          default: motif_id
                          description: Cycle id variable. Rows with cycle_var NaN or <= 0 are dropped.
                        color_var:
                          type: [string, "null"]
                          default: null
                          description: Optional variable used for color mapping (visualMap)
                        filter:
                          type: [object, "null"]
                          default: null
                          description: |
                            Optional per-cycle value filter. A whole cycle is dropped when its mean of
                            varname is NaN, below min or above max. Bounds are individually optional
                            (null disables that bound).
                          properties:
                            varname:
                              type: string
                            min:
                              type: [number, "null"]
                            max:
                              type: [number, "null"]
                        angular_step:
                          type: number
                          default: 5
                          description: Angular binning step in degrees
                        max_points:
                          type: integer
                          default: 5000
                          description: Total budget of plotted points across shown cycles (NOT a cycle count). Cycles are sub-sampled so that n_cycles * points-per-cycle (~360/angular_step + 1) stays under this cap.
                        x:
                          type: object
                          description: X axis filter configuration
                          properties:
                            type:
                              type: string
                              enum: [range, selection]
                              default: range
                              description: '"range" to filter by explicit bounds, "selection" to use a saved selection'
                            name:
                              type: string
                              enum: [T, D, T_norm]
                              default: T
                              description: X axis variable — the single time-like column loaded (T, D or T_norm)
                            range:
                              type: array
                              items:
                                type: number
                              description: "Filter bounds [start, end] (type range only; [] = whole record)"
                              default: []
                            num:
                              type: [integer, "null"]
                              description: Selection number (type selection only)
                            normalize:
                              type: boolean
                              default: false
                              description: When true (selection only), offset the range so the selection starts at 0
                            user_offset:
                              type: number
                              default: 0
                              description: Additional offset applied to the returned x values
                            x_sub_range:
                              type: array
                              items:
                                type: number
                              description: "Optional sub-range [start, end] in normalized (display) coords, for zoom reload"
              example: {
                "data": {
                  "818": [
                    {
                      "angle_var": "Theta",
                      "radius_vars": ["Ft_d", "Ft_g"],
                      "cycle_var": "motif_id",
                      "color_var": null,
                      "filter": {"varname": "Cadence", "min": 10, "max": null},
                      "angular_step": 5,
                      "max_points": 5000,
                      "x": {"type": "range", "name": "T", "range": [0.0, 100.0]}
                    }
                  ]
                }
              }
      responses:
        "200":
          description: |
            Polar plot data (columnar) keyed by record id. A shared `theta` grid (0..360 with a
            360° closing point), the per-cycle series and the always-present `mean` series, plus meta.
            Each cycle carries a TIME-ordered cursor polyline: `xt` (times, monotone, offset applied)
            and `xa` (crank angle at each `xt`, UNWRAPPED so monotone — apply `xa % 360`). Every
            `cycles[*].xt`, `cycles[*].xa`, `cycles[*].values` and `mean.values` series has the same
            length as `theta`.
          content:
            application/json:
              schema:
                type: object
                example: {
                  "818": {
                    "theta": [0, 5, 10, 355, 360],
                    "x_name": "T",
                    "xrange": [0.0, 100.0],
                    "cycles": [
                      {
                        "motif_id": 12,
                        "xt": [10.0, 10.3, 10.6, 10.9, 11.2],
                        "xa": [209.0, 280.0, 360.0, 450.0, 560.0],
                        "values": {"Ft_d": [12.3, 13.1, 11.8, 12.0, 12.3], "Ft_g": [9.1, 9.4, 8.9, 9.0, 9.1]},
                        "color_mean": 85.3
                      }
                    ],
                    "mean": {"values": {"Ft_d": [12.1, 12.9, 11.6, 11.9, 12.1], "Ft_g": [9.0, 9.3, 8.8, 8.9, 9.0]}},
                    "color_var": "Cadence",
                    "color_range": [70.0, 95.0],
                    "meta": {"n_cycles_total": 42, "n_cycles_shown": 30, "angular_step": 5}
                  }
                }
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "409":
          $ref: '#/components/responses/409'
        "500":
          $ref: '#/components/responses/500'

