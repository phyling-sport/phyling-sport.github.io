components:
  schemas:
    OAuthTokenRequest:
      description: >
        Token request body, accepted as JSON or as application/x-www-form-urlencoded.
        client_id and client_secret may be omitted here when they are sent in an
        `Authorization: Basic` header.
      type: object
      properties:
        grant_type:
          type: string
          enum: ["authorization_code", "refresh_token"]
          example: "authorization_code"
        client_id:
          type: string
          example: "clientid_abc123"
        client_secret:
          type: string
          example: "secret_456"
        code:
          type: string
          example: "abc123def456"
          description: Required for the authorization_code grant
        refresh_token:
          type: string
          example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
          description: Required for the refresh_token grant
        redirect_uri:
          type: string
          example: "https://example.com/callback"
          description: Required for the authorization_code grant, ignored otherwise
      required:
        - grant_type
    OAuthRevokeRequest:
      description: >
        Revocation request body, accepted as JSON or as application/x-www-form-urlencoded.
        client_id and client_secret may be omitted here when they are sent in an
        `Authorization: Basic` header.
      type: object
      properties:
        token:
          type: string
          example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
        token_type_hint:
          type: string
          enum: ["access_token", "refresh_token"]
          example: "refresh_token"
        client_id:
          type: string
          example: "clientid_abc123"
        client_secret:
          type: string
          example: "secret_456"
      required:
        - token
    OAuthUserInfo:
      description: Identity of the user who authorized the calling OAuth application
      type: object
      properties:
        sub:
          type: string
          description: The user id, as a string (OpenID Connect naming)
          example: "42"
        user_id:
          type: integer
          description: The user id, the identifier to store on the third party side
          example: 42
        email:
          type: string
          example: "user@example.com"
        firstname:
          type: string
          example: "Jean"
        lastname:
          type: string
          example: "Dupont"
        active:
          type: boolean
          example: true
    WebhookEventType:
      type: string
      enum:
        - record.created
        - record.updated
        - record.deleted
        - user.created
        - user.updated
        - user.deleted
    WebhookPayloadFormat:
      type: string
      description: >
        Serialisation key, not an event sub-type: the same event on the wire in another shape.
        "phyling" is the thin default payload (event_id, event_type, event_time, subject).
      enum:
        - phyling
      example: "phyling"
    WebhookSubscription:
      description: One outgoing webhook endpoint declared by an OAuth application, never carrying a secret
      type: object
      properties:
        id:
          type: integer
          example: 42
        app_client_id:
          type: string
          example: "clientid_abc123"
        url:
          type: string
          example: "https://mon-serveur.example.com/webhooks/phyling"
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        payload_format:
          $ref: '#/components/schemas/WebhookPayloadFormat'
        active:
          type: boolean
          example: true
        replay_history:
          type: boolean
          description: >
            Whether the first consent of a user backfills this subscription with their recent
            records: one `record.created` per record decoded over the last 30 days, up to 100 of
            them, spread over several passes. Only gates that automatic backfill, never the live
            deliveries. Set it to false to receive nothing but what happens after the consent,
            and catch up yourself with `GET /records?since=...`.
          example: true
        created_at:
          type: string
          example: "2026-09-03 10:00:00"
        prev_secret_expires_at:
          type: string
          description: Empty outside a rotation grace window
          example: ""
    WebhookSubscriptionWithSecret:
      description: A subscription right after creation or a secret rotation
      allOf:
        - $ref: '#/components/schemas/WebhookSubscription'
        - type: object
          properties:
            secret:
              type: string
              description: The plain signing secret. Shown only this once, store it securely.
              example: "whsec_9f3a2c1e8b7d..."
    WebhookSubscriptionCreateRequest:
      type: object
      properties:
        client_id:
          type: string
          example: "clientid_abc123"
        client_secret:
          type: string
          example: "secret_456"
        url:
          type: string
          example: "https://mon-serveur.example.com/webhooks/phyling"
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        payload_format:
          allOf:
            - $ref: '#/components/schemas/WebhookPayloadFormat'
          description: Defaults to "phyling" when omitted
        replay_history:
          type: boolean
          description: >
            Defaults to true when omitted: the first consent of a user backfills the subscription
            with up to 100 `record.created` for the records decoded over the last 30 days. Send
            false to only receive what happens after the consent.
          example: true
      required:
        - url
        - event_types
    WebhookSubscriptionUpdateRequest:
      type: object
      description: Every field is optional, send only what changes
      properties:
        url:
          type: string
          example: "https://mon-serveur.example.com/webhooks/phyling"
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        payload_format:
          $ref: '#/components/schemas/WebhookPayloadFormat'
        active:
          type: boolean
          example: false
        replay_history:
          type: boolean
          description: >
            Only changes what a *later* first consent replays; it never replays anything on the
            subscription it is set on.
          example: true
    Sport:
